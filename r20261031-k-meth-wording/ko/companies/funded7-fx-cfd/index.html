<div class="rh-card"><h3>변경 내역 <small>최신순. 변경일과 확인 정보를 구분해 표시합니다</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="R947b7de2d1" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">레버리지 인하 2(기간: 2026년 5월 21일~10월 16일): Instant FX 1:50→1:30, 금속·지수 1:10→1:5, 암호자산 1:3→1:2(이색 통화쌍은 1:10→1:30으로 상향). PAYG 열 추가, 표는 MT5 전용으로 변경.</p><p class="rh-rs">Instant의 주요 종목에서 FX 1:50→1:30, 금속·지수 1:10→1:5 등 거래할 수 있는 양이 줄었습니다. 대상 플랜은 한정적이며, 이그조틱은 상향되었습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20260521165507/https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rbdb75d0e49" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">SL 설정의 30초 유예를 MT5에만 적용한다는 주석 추가</p><p class="rh-rs">SL의 30초 유예가 MT5에만 한정된다는 주석이 추가되었습니다. MT5 외에서는 유예를 쓸 수 있는 범위가 좁아집니다. 실제 운용의 변화나 처분 사례는 확인하지 않았습니다. 변경 전에도 같은 운용이었던 것으로 밝혀지면 재검토합니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260603190654/https://funded7.com/faqs/trading-rules/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20261012031845/https://funded7.com/faq/rule-2-3-position-risk-execution/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R605d5c2de6" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-08</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">약관에서 출금 7일 대기·자동 거절 조항 삭제(기간: 2026년 4월 20일~8월 5일)</p><p class="rh-rs">제한 철폐. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260805090512/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260420005017/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rba25826a85" data-approved-category="rank-C" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-08</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#c9a227">경계 등급: C</span></div><p class="rh-chg">약관의 휴면 조항 문구를 FAQ와 맞춤(거래 시작 후 휴면이면 계좌 종료·재개 불가)</p><p class="rh-rs">계정 종료·재개 불가라는 내용은 이전부터 FAQ에 있었습니다. 이번에는 약관 문구를 FAQ에 맞춘 작은 변경입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260805090512/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20261012005839/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rf426e33791" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-06-17</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">플랜 개정: PAYG 일일/최대 손실 상한 4%/8% → 5%/10%</p><p class="rh-rs">손실 허용 확대. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://x.com/TodorFunded7/status/2067139410420719978" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://x.com/funded7jp/status/2069541014637830437" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R132a5d5260" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-05-12</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">SL 설정에 30초 유예를 도입하고 유효하지 않은 SL 처리 명확화</p><p class="rh-rs">오판정 구제. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260420001832/https://funded7.com/faqs/trading-rules/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260603190654/https://funded7.com/faqs/trading-rules/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://x.com/funded7jp/status/2055160661723000926" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="Rc815b6f5a1" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-04</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">약관(T&amp;C) 16조에 비밀유지 조항 추가(기간: 2026년 3월 11일~4월 20일): 계좌 정보·대화 공개 금지</p><p class="rh-rs">계정 정보나 대화의 공개를 제한하는 비밀유지 의무가 새로 더해져 이용자의 발신이 제약됩니다. 위반 시 수익이 몰수되는지는 확인하지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260420005017/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260311044905/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R73cee669e4" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-04</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">약관에 출금 대기 조항 추가(기간: 2026년 3월 11일~4월 20일): 출금 후 7일 재신청 불가, 조건 미달 신청 자동 거절</p><p class="rh-rs">출금 후 7일 동안은 다시 신청할 수 없게 되어 출금 빈도가 제한되었습니다. 수익 몰수나 장기 출금 정지를 수반하는 변경은 아닙니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260420005017/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260311044905/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R466c8dffe2" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-02-14</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">수수료: 암호자산·지수 거래 수수료를 랏당 $1로 인하</p><p class="rh-rs">비용 감소. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260122101628/https://funded7.com/faqs/purchases-and-payouts/are-there-any-additional-fees-or-charges/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260215165528/https://funded7.com/faqs/purchases-and-payouts/are-there-any-additional-fees-or-charges/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R38a3c799d6" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-02-03</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#c62c33">경계 등급: A</span></div><p class="rh-chg">스캘핑 정량 기준 추가: 15초 미만 보유 거래가 전체의 2% 초과 또는 30초 미만이 3% 초과면 단계 강등(Rule 2·3). 기존 “Is Scalping Allowed? Yes”(약 15초는 대체로 허용) 기사는 1월 22일에도 게시.</p><p class="rh-rs">소수 거래의 비율(2%/3%)로 계정 단계가 내려가는 기준이 새로 더해졌습니다. 단계가 내려가면 거래 조건 전체에 영향을 주므로 실질적인 새로운 처분입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260215161210/https://funded7.com/ja/faqs/trading-rules-ja/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260122094717/https://funded7.com/faqs/trading-rules/is-scalping-allowed-yes-read-our-rules/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R88c2694369" data-approved-category="unjudged" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-02-03</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: —</span></div><p class="rh-chg">Rule 4(거래 복사/EA) 개정: 타인의 EA·신호 복사 금지를 명문화하고 위반 제재를 규정, Tick Scalping 금지 주석 추가</p><p class="rh-rs">금지 사항의 명문화와 주석 추가는 확인할 수 있지만, 변경 전후의 원문이 없어 금지 범위나 처분이 넓어졌는지 확정할 수 없으므로 경계 등급은 매기지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260420004738/https://funded7.com/faqs/trading-rules/rule-4-prohibited-strategies-fair-play/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260122113134/https://funded7.com/faqs/trading-rules/rule-4-prohibited-strategies-fair-play/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R79a70abe41" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-12</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">레버리지 인하 1(기간: 2025년 11월 12일~2026년 2월 7일): 금속 One Phase 1:30→1:5, Two Phase 1:50→1:10, Instant 1:50→1:10; 지수 One Phase 1:10→1:5; MT5 이색 통화쌍 1:30·1:50→1:10, MT5 원자재 1:10→1:5, MT5 암호자산(One Phase) 1:3→1:2. 1:60/1:100 추가 옵션 열 삭제.</p><p class="rh-rs">레버리지의 대폭 축소이므로 B입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260207133238/https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20251112171318/https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Recd4237d15" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-10</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">SL 우선 규칙: SL 체결과 규칙 위반 판정이 겹치면 SL을 우선해 위반으로 취급하지 않음</p><p class="rh-rs">오판정 구제. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://x.com/funded7jp/status/2009817330902258106" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R1ff51dd94a" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-05</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-flag">🚩 소급 적용</span><span class="rh-ann">공지 확인</span><span class="rh-rank" style="background:#c62c33">경계 등급: A</span></div><p class="rh-chg">OREF(Objective Risk Enforcement Framework) 도입: Pro 계좌를 Gold/Silver/Bronze로 구분(거래당 최대 위험 3%/2%/1%, 레버리지 상한 1:50/1:30/1:20, Silver·Bronze는 SL 필수). ATR 위험 측정·상관 버킷·위반 시 수익 무효화와 스트라이크 제도 포함. 기존 Pro 계좌에도 적용.</p><p class="rh-rs">기존 Pro 계정을 포함해 리스크 단계·SL 의무·레버리지·수익 무효화가 한꺼번에 도입되어 영향이 큰 변경입니다. 공지되었으며, 위반 기준과 구제 조치가 제시되어 있습니다.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://funded7.com/faq/funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20260122110446/https://funded7.com/faqs/trading-rules/important-funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://x.com/funded7jp/status/2009817330902258106" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="Rb00e747784" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-05</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지 확인</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">Rule 1(일관성) 수식화: 재량 판단(85% 군집 예시) → 랏 수 중앙값 ×2.5와 IQR에 따른 이상치 판정, 품질 계수 QC ≥0.90</p><p class="rh-rs">일관성 심사는 이전부터 있었고, 이번에는 이상치·QC 계산식이 제시되었습니다. 수익이 무효가 되는 범위가 넓어지므로 B입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">근거: 공식 도움말 /</p><p class="rh-src">출처:<a href="https://funded7.com/faq/rule-1-payout-criteria/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20251112170555/https://funded7.com/faqs/trading-rules/understanding-inconsistent-trading-patterns-at-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260122095335/https://funded7.com/faqs/trading-rules/rule-1-consistency-the-gateway-to-pro/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rb609352a7a" data-approved-category="rank-C" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-01-05</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">중립</span><span class="rh-ann">공지 확인</span><span class="rh-rank" style="background:#c9a227">경계 등급: C</span></div><p class="rh-chg">최소 요건: 0.5% 이상 수익일 3일 → 거래일 3일과 청산 거래 10회. 거래일 정의도 신규 포지션을 연 날에서 신규 주문 또는 청산이 있던 날로 변경(Rule 1B에서 출금에도 동일 요건).</p><p class="rh-rs">수익일 조건은 없어졌지만 새로 10회의 결제가 필요해졌습니다. 절차 부담이 늘어나는 변경입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">근거: 보관본 비교 → 공식 공지 확인 /</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260307171451/https://funded7.com/general-rules/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20251206020724/https://funded7.com/general-rules/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R5fe8b1a0a9" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-05</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">위반 처리: 주로 계좌 정지 → 위반 거래 수익 무효화와 단계적 스트라이크 제도로 변경</p><p class="rh-rs">즉시 정지가 줄고 처분이 단계적으로 바뀌었습니다. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://funded7.com/faq/funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20260122110446/https://funded7.com/faqs/trading-rules/important-funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li></ol></div>
