<div class="rh-card"><h3>변경 내역 <small>최신순. 변경일과 확인 정보를 구분해 표시합니다</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="R0e0cf26795" data-approved-category="unjudged" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-08-19</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: —</span></div><p class="rh-chg">제한 규칙이 두 단계로 나뉩니다. L1은 최대 위험 1%와 보상 배분율 15%포인트 감소, L2는 일일 수익 상한 +1%, 레버리지 FX 1:10·기타 1:5, 배분율 30%포인트 감소와 포인트 단계 동결을 포함합니다.</p><p class="rh-rs">L1/L2 보수율 인하와 수익 상한은 무거운 내용이지만, 변경 전 제도의 내용을 확인하지 못해 무엇이 새로 엄격해졌는지 확정할 수 없으므로 경계 등급은 매기지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">근거: 일본어 FAQ 점검(2026년 8월 13일 갱신) / 공지 확인</p><p class="rh-src">출처:<a href="https://support.fintokei.com/ja/articles/11315966" target="_blank" rel="noopener noreferrer">support.fintokei.com</a></p></div></li><li class="rh-ev" data-history-id="R7e89daa265" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-08-06</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">ProTrader Swing의 계좌 크기가 $5K~$200K로 확대되고 스왑 프리로 바뀌었습니다.</p><p class="rh-rs">선택지 확대·비용 감소. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://www.fintokei.com/blog/protrader-swing-new-conditions/" target="_blank" rel="noopener noreferrer">www.fintokei.com</a></p></div></li><li class="rh-ev" data-history-id="R6f79b2ee7e" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-07-16</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><spa
