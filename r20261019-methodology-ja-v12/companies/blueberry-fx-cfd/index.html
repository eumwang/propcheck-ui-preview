<div class="rh-card"><h3>タイムライン <small>新しい順・変更日と確認情報は分けて表示</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="R6d87e105de" data-approved-category="unjudged" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-10-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">シンセティック：既存の12銘柄を新しい24銘柄（Boom/Crash/Flip/Step/FX Volの5系統）に置換、新ルールではEA可。10/8以降の新規購入は即適用。既存口座は購入時のルール・銘柄を維持し、評価中はフェーズ合格時、ファンデッドは次回出金後に新ルールへ移行</p><p class="rh-rs">EAは使えるようになりましたが、12銘柄が24の新銘柄に置き換わりました。消えた銘柄や移行時の保有の扱いが確認できていないため、警戒度は付けていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.blueberryfunded.com/en/articles/16969211-what-is-changing-on-our-synthetic-plans-from-8-october-2026" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a></p></div></li><li class="rh-ev" data-history-id="Rcbe291440f" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-flag">🚩 遡及適用</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">シンセティック資金口座：5分未満保有の利益を出金額から除外（10/8以降購入分は即適用。既存口座も評価中はフェーズ合格時、ファンデッドは次回出金後に新ルールへ移行して適用）</p><p class="rh-rs">5分未満の保有で得た利益が出金の対象外になり、既存口座も移行後はその利益を受け取れなくなります。利益の除外が加わったためAです。事前の告知と移行の区切りがあります。</p><p class="rh-meta">確認：公式ヘルプ</p><p class="rh-src">出典：<a href="https://help.blueberryfunded.com/en/articles/10622848" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a> <a href="https://help.blueberryfunded.com/en/articles/16969211-what-is-changing-on-our-synthetic-plans-from-8-october-2026" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a></p></div></li><li class="rh-ev" data-history-id="Ra8546560c1" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-flag">🚩 遡及適用</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">シンセティック資金口座：一貫性30%→25%（10/8以降購入分は即適用。既存口座も評価中はフェーズ合格時、ファンデッドは次回出金後に新ルールへ移行して適用）</p><p class="rh-rs">一貫性の基準が30%から25%に厳しくなり、合格・出金の条件が狭まりました。既存口座にも移行後（評価中はフェーズ合格時、ファンデッドは次回出金後）に適用されますが、移行の時期は告知されています。</p><p class="rh-meta">確認：公式ヘルプ</p><p class="rh-src">出典：<a href="https://help.blueberryfunded.com/en/articles/17306123" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a> <a href="https://help.blueberryfunded.com/en/articles/16969211-what-is-changing-on-our-synthetic-plans-from-8-october-2026" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a></p></div></li><li class="rh-ev" data-history-id="Rea47231bde" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-10-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">シンセティック：単一のSynthetic Challenge→1-Step（目標8%・最大8%・日次4%・最低5日）／2-Step（P1 10%・P2 5%・最大10%・日次4%・各フェーズ最低3日）／Instant Funding（最大10%・日次3%・最低5日）の3プランに再編。全プラン配分80%・$2.5K〜$100K、リセットは評価のみ</p><p class="rh-rs">プラン再編のまとめです。5分ルール・一貫性・戦略禁止はそれぞれ別の行に載せています。そのほかの条件は変更前と比べられる資料がないため、警戒度は付けていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.blueberryfunded.com/en/articles/16969211-what-is-changing-on-our-synthetic-plans-from-8-october-2026" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a> <a href="https://help.blueberryfunded.com/en/articles/10622848" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R94a9a99768" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-flag">🚩 遡及適用</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">シンセティック：グリッド・マーチンゲールを禁止（現行ルールでは可）。10/8以降購入分は即適用、既存口座は評価中はフェーズ合格時、ファンデッドは次回出金後に新ルールへ移行して適用</p><p class="rh-rs">これまで使えたグリッド・マーチンゲールが、既存のシンセティック口座でも移行時から禁止されました。取引手法への大きな変更ですが、事前の告知と移行の猶予があります。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.blueberryfunded.com/en/articles/16969211-what-is-changing-on-our-synthetic-plans-from-8-october-2026" target="_blank" rel="noopener noreferrer">help.blueberryfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R5765e19eeb" data-event-id="R5765e19eeb" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-09-01</b><small>変更日</small></div><div class="rh-bx">
