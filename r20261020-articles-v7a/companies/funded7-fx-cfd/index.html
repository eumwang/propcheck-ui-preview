<div class="rh-card"><h3>タイムライン <small>新しい順・変更日と確認情報は分けて表示</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="R947b7de2d1" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">レバレッジ引き下げ②（期間：2026-05-21〜10-16）：Instant FX 1:50→1:30、貴金属・指数 1:10→1:5、暗号資産 1:3→1:2（エキゾチックは1:10→1:30に引き上げ）。PAYG列を追加し表をMT5のみに</p><p class="rh-rs">Instantの主要銘柄でFX 1:50→1:30、金属・指数 1:10→1:5など、取引できる量が減りました。対象プランは限られ、エキゾチックは引き上げられています。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20260521165507/https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rbdb75d0e49" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">SLの30秒猶予をMT5のみに限定する注記を追加</p><p class="rh-rs">SLの30秒の猶予がMT5だけに限られる注記が加わりました。MT5以外では猶予を使える範囲が狭まります。実際の運用の変化や処分の例は確認していません。変更前も同じ運用だったと分かれば見直します。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260603190654/https://funded7.com/faqs/trading-rules/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20261012031845/https://funded7.com/faq/rule-2-3-position-risk-execution/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R605d5c2de6" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">規約から出金7日クールダウン・自動却下条項を削除（期間：2026-04-20〜08-05）</p><p class="rh-rs">制限の撤廃。利用者に不利になる点は確認されていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260805090512/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260420005017/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rba25826a85" data-approved-category="rank-C" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-08</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#c9a227">警戒度：C</span></div><p class="rh-chg">規約の休眠（inactivity）条項の文言をFAQに合わせて修正（取引開始後の休眠は終了・再開不可）</p><p class="rh-rs">口座終了・再開不可という内容は、以前からFAQにありました。今回は規約の文言をFAQに合わせた小さな変更です。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260805090512/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20261012005839/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rf426e33791" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-06-17</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">ラインナップ改定：PAYGの損失上限 日次4%/最大8%→5%/10%</p><p class="rh-rs">損失許容の拡大。利用者に不利になる点は確認されていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://x.com/TodorFunded7/status/2067139410420719978" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://x.com/funded7jp/status/2069541014637830437" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R132a5d5260" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-05-12</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">SL設定に30秒の猶予を導入し、無効なSLの扱いを明確化</p><p class="rh-rs">誤判定の救済。利用者に不利になる点は確認されていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260420001832/https://funded7.com/faqs/trading-rules/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260603190654/https://funded7.com/faqs/trading-rules/rule-2-3-position-risk-execution-the-safety-net/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://x.com/funded7jp/status/2055160661723000926" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="Rc815b6f5a1" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-04</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">規約（T&amp;C）第16条に守秘義務条項を追加（期間：2026-03-11〜04-20）：口座情報・やり取りの公開を禁止</p><p class="rh-rs">口座情報ややり取りの公開を制限する守秘義務が新たに加わり、利用者の発信が制約されます。違反時に利益が没収されるかは確認していません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260420005017/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260311044905/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R73cee669e4" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-04</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">規約に出金クールダウン追加（期間：2026-03-11〜04-20）：出金後7日間は再申請不可、条件未達の申請は自動却下</p><p class="rh-rs">出金後7日間は再申請できなくなり、出金の頻度が制限されました。利益の没収や長期の出金停止を伴う変更ではありません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260420005017/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260311044905/https://funded7.com/terms-and-conditions/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R466c8dffe2" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-02-14</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">手数料：暗号資産・指数の取引手数料を1ロット$1に引き下 le 4（コピートレード/EA）改定：他者のEA・シグナルのコピー禁止を明文化し違反時の処分を規定、Tick Scalping禁止の注記を追加</p><p class="rh-rs">禁止事項の明文化と注記の追加は確認できますが、変更前後の原文がなく、禁止範囲や処分が広がったかを確定できないため、警戒度は付けていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260420004738/https://funded7.com/faqs/trading-rules/rule-4-prohibited-strategies-fair-play/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260122113134/https://funded7.com/faqs/trading-rules/rule-4-prohibited-strategies-fair-play/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R79a70abe41" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-12</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">レバレッジ引き下げ①（期間：2025-11-12〜2026-02-07）：貴金属 One Phase 1:30→1:5、Two Phase 1:50→1:10、Instant 1:50→1:10／指数 One Phase 1:10→1:5／MT5エキゾチック 1:30・1:50→1:10、MT5コモディティ 1:10→1:5、MT5暗号資産(One Phase) 1:3→1:2。1:60/1:100アドオン列を削除</p><p class="rh-rs">レバレッジの大幅な縮小のためBです。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260207133238/https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20251112171318/https://funded7.com/faqs/trading-specs/how-does-leverage-work-in-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Recd4237d15" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-10</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">SL優先ルール：SL約定とルール違反判定が重なった場合はSLを優先し違反扱いにしない</p><p class="rh-rs">誤判定の救済。利用者に不利になる点は確認されていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://x.com/funded7jp/status/2009817330902258106" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R1ff51dd94a" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-05</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-flag">🚩 遡及適用</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">OREF（Objective Risk Enforcement Framework）導入：Pro口座をGold/Silver/Bronzeの3段階に区分（1トレード最大リスク3%/2%/1%、レバレッジ上限1:50/1:30/1:20、Silver・BronzeはSL必須）、ATRベースのリスク計測・相関バケット・違反時の利益無効化＋ストライク制。既存のPro口座にも適用</p><p class="rh-rs">既存のPro口座も含めて、リスク段階・SLの義務・レバレッジ・利益無効化がまとめて導入され、影響が大きい変更です。告知されており、違反の基準と救済措置が示されています。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://funded7.com/faq/funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20260122110446/https://funded7.com/faqs/trading-rules/important-funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://x.com/funded7jp/status/2009817330902258106" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="Rb00e747784" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-05</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">Rule 1（一貫性）を数式化：裁量判定（85%クラスタ例示）→ロット中央値×2.5・IQR基準の外れ値判定＋品質係数QC≥0.90</p><p class="rh-rs">一貫性の審査は以前からあり、今回は外れ値・QCの計算式が示されました。利益が無効になる範囲が広がるためBです。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式ヘルプ</p><p class="rh-src">出典：<a href="https://funded7.com/faq/rule-1-payout-criteria/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20251112170555/https://funded7.com/faqs/trading-rules/understanding-inconsistent-trading-patterns-at-funded7/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260122095335/https://funded7.com/faqs/trading-rules/rule-1-consistency-the-gateway-to-pro/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rb609352a7a" data-approved-category="rank-C" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-01-05</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#c9a227">警戒度：C</span></div><p class="rh-chg">最低取引日数要件：利益日（0.5%以上）3日→取引日3日＋決済10回に変更。取引日の定義も「新規ポジションを建てた日」→「新規注文または決済があった日」に変更（Rule 1Bで出金にも同要件）</p><p class="rh-rs">利益日の条件はなくなりましたが、新たに10回の決済が必要になりました。手続きの負担が増える変更です。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較・公式告知</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260307171451/https://funded7.com/general-rules/" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20251206020724/https://funded7.com/general-rules/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R5fe8b1a0a9" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-05</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">違反時の扱い：口座停止中心→違反トレードの利益無効化＋ストライク制（段階的処分）に変更</p><p class="rh-rs">即時停止が減り処分が段階的に。利用者に不利になる点は確認されていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://funded7.com/faq/funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">funded7.com</a> <a href="https://web.archive.org/web/20260122110446/https://funded7.com/faqs/trading-rules/important-funded7-new-risk-framework-oref-new-standards-for-fairness-and-transparency/" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li></ol></div>
