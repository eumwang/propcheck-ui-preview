<div class="rh-card"><h3>タイムライン <small>新しい順・変更日と確認情報は分けて表示</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="R51614bbe79" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-16</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">2 Step Standard 報酬サイクル：Weekly 60%／Bi-Weekly 80%／Monthly 100%／On Demand 90%（35%一貫性スコア・最低2%で随時申請可）→On Demand 90%を削除（Weekly／Bi-Weekly／Monthlyのみ）</p><p class="rh-rs">2 Step Standardで、いつでも90%で出金できる選択肢がなくなりました。Weekly 60%・Bi-Weekly 80%・Monthly 100%は残りますが、出金の時期と配分を選ぶ幅が狭まる重要な変更です。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式サイトの比較／告知：不明</p><p class="rh-src">出典：<a href="https://help.fundingpips.com/hc/en-us/articles/34501809112081-2-Step-Standard" target="_blank" rel="noopener noreferrer">help.fundingpips.com</a></p></div></li><li class="rh-ev" data-history-id="R30214e81f7" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-09-28</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">新規口座：Risk Per Trade Idea・Striking System・Profit Concentrationの3ルール撤廃</p><p class="rh-rs">制約が撤廃されました。公式ヘルプの旧ルール記事に「2026-09-28より前の購入分に適用」と明記されています（Profit Concentrationなどは旧ルール側）。公式ブログでも告知されています。利用者に不利になる点は確認されていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.fundingpips.com/hc/en-us/articles/51307058233361-FundingPips-Legacy-Rules" target="_blank" rel="noopener noreferrer">help.fundingpips.com</a></p></div></li><li class="rh-ev" data-history-id="Rf614c1b455" data-approved-category="unjudged" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-09</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">Flex 利益配分：85%→80%（第三者の指摘）</p><p class="rh-rs">Flexの利益配分85%→80%は第三者の指摘のみで、公式には確認できていないため、警戒度は付けていません。変更が確認できればBです。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：報道</p><p class="rh-src">出典：<a href="https://fundingpips.com/blog/cfds-glory-days-are-back-three-rules-gone-fundingpips-updates" target="_blank" rel="noopener noreferrer">fundingpips.com</a></p></div></li><li class="rh-ev" data-history-id="R8b499f27b2" data-event-id="R8b499f27b2" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-08-27</b><small>変更日</small></div><div class="rh-bx">
<div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-flag">🚩 サイレント変更</span><span class="rh-ann">告知なし（Discordのみ・サイレント扱い）</span><span class="rh-rank rh-rank-s">警戒度：S</span></div>
<p class="rh-lbl">SUME（予定外市場イベント）利益控除条項</p><div class="rh-ba"><span class="rh-b">変更前：利益控除条項を導入（発効日・既存口座への適用は未確認）</span><span class="rh-ar">→</span><span class="rh-a rh-a-bad">変更後：批判を受け撤回</span></div><p class="rh-rs">後から利益を差し引ける曖昧な条項の導入と撤回を、1つの出来事として載せています。実際の利益の差し引き・返金・救済は確認していません。</p>
<p class="rh-rs">撤回と続報は、この行にまとめています。</p><p class="rh-meta">確認：報道</p><p class="rh-src">出典：<a href="https://thepropjournalist.com/news/fundingpips-removes-sume/" target="_blank" rel="noopener noreferrer">thepropjournalist.com</a></p><p class="rh-src"><a href="#rule-R8b499f27b2" data-rule-link="history">撤回済み条項の履歴詳細を見る →</a></p></div></li><li class="rh-ev" data-history-id="Ref849bc52c" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-07-24</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-flag">🚩 遡及適用</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">2 Step Standard 利益目標10%プラン：提供終了。既存の10%目標口座は2 Step Flex（配分85%）としてリセット</p><p class="rh-rs">既存口座の強制リセット・移行は確認できますが、利益・進捗の引き継ぎと移行前後の条件が確認できないため、警戒度は付けていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.fundingpips.com/hc/en-us/articles/51307058233361-FundingPips-Legacy-Rules" target="_blank" rel="noopener noreferrer">help.fundingpips.com</a></p></div></li><li class="rh-ev" data-history-id="R65c95c332d" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-06-27</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">Profit Concentration Policy導入：評価中に1トレードアイデアが利益目標の60%超→Master口座で毎回の出金前に利益日4日（各0.5%以上）が必要</p><p class="rh-rs">評価で利益が1つの取引に集中した場合、その後の出金のたびに利益日4日が必要になります。作成日以降の新しい評価口座のみで、告知されています。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.fundingpips.com/hc/en-us/articles/51307058233361-FundingPips-Legacy-Rules" target="_blank" rel="noopener noreferrer">help.fundingpips.com</a></p></div></li><li class="rh-ev" data-history-id="R1ed617b626" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-03-16</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">Master口座の金属・指数・エネルギー：→一時的な段階制ダイナミックレバレッジ（0.05ロットまで1:50、段階的に下がり0.50ロット超は1:5）</p><p class="rh-rs">変更前のレバレッジの値が確認できず、どれだけ厳しくなったか比べられないため、警戒度は付けていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://help.fundingpips.com/hc/en-us/articles/51307058233361-FundingPips-Legacy-Rules" target="_blank" rel="noopener noreferrer">help.fundingpips.com</a></p></div></li><li class="rh-ev" data-history-id="R1030183de6" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-02-23</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">ニュース違反：主観的判定→ニュース前後5分の制限・違反時は利益控除</p><p class="rh-rs">変更前の基準と比べて対象範囲や処分がどう変わったか確認できないため、警戒度は付けていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：報道</p><p class="rh-src">出典：<a href="https://propfirmmatch.com/industry-news/fundingpips-announces-rule-structure-revision-exposure-adjustments-effective-february-23" target="_blank" rel="noopener noreferrer">propfirmmatch.com</a></p></div></li><li class="rh-ev" data-history-id="R9da086c2a0" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-02-23</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">1トレードのリスク上限：→口座規模別の上限を設定</p><p class="rh-rs">口座の規模ごとに、1取引のリスク上限（3%／2%）が加わりました。実質的な制約です。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：報道</p><p class="rh-src">出典：<a href="http
