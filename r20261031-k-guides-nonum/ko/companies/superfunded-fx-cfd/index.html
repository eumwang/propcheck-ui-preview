h-c:#8a959c"><div class="rh-dt"><b>2026-08-31</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">중립</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: —</span></div><p class="rh-chg">Rules V2 31.08.26: 과다 익스포저 판단 기준을 랏 수에서 명목 금액으로 변경</p><p class="rh-rs">랏에서 금액으로 환산만 한 것인지 실제 상한이 엄격해진 것인지, 기준값과 대상 종목을 알 수 없어 경계 등급은 매기지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R152a14c0df" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-03-24</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#c62c33">경계 등급: A</span></div><p class="rh-chg">Rules V2 24.03.26: 미실현·실현 손실과 관계없이 랏 수를 단계적·공격적으로 늘리거나 유지하는 행위까지 마틴게일 정의 확대</p><p class="rh-rs">원래 있던 마틴게일 금지가 손익과 관계없이 랏을 늘리거나 유지하는 것까지 넓어졌습니다. 일반적인 사이즈 조정도 위반으로 간주될 우려가 있고, 업체의 판단으로 금지할 수 있는 범위가 크게 넓어졌으므로 A입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260205224605/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R7af86fa44e" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-29</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#c62c33">경계 등급: A</span></div><p class="rh-chg">Rules V2 29.01.26: 도박성 거래로 판단되면 5% 수익 상한을 추가 세 차례 출금에 적용하고 출금액을 “신청액(수익 상한 이내)”으로 변경</p><p class="rh-rs">5%의 수익 상한은 이전부터 있습니다. 이번에는 도박성으로 판단된 뒤 추가로 3회 출금까지 상한을 연장할 수 있게 되어, 금액과 기간 양면에서 출금 처분이 넓어졌습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260205224605/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R913aafa24c" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">Rules V2: 2 Step 레버리지 인하: FX 1:100 → 1:50, 원자재 1:30 → 1:10, 지수 1:50 → 1:20, 암호자산 1:5 → 1:2</p><p class="rh-rs">2 Step의 주요 종목에서 레버리지가 1/2~1/3 정도로 낮아졌습니다. 대상 플랜에서 거래할 수 있는 양이 줄지만, 수익 몰수나 기존 포지션의 강제 결제는 더해지지 않았으므로 B입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R9759444dc1" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">중립</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: —</span></div><p class="rh-chg">Rules V2: 일일 손실 한도 기준을 평가금액에서 잔고로 변경</p><p class="rh-rs">손실 기준이 유효 증거금에서 잔고로 바뀌었지만, 영향은 매일의 참조 시점이나 평가손익의 취급에 따라 달라지고 계산식을 확인할 수 없어 경계 등급은 매기지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Reb3a2a8646" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">Rules V2: 출금 대기 기간을 14일로 통일(2 Step은 기존보다 단축)</p><p class="rh-rs">대기 기간 단축. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R5b753bc716" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">Rules V2: 수익 분산 규칙 변경(1 Step 50%/40% → 40%/30%, 2 Step 단일 거래 기준 → 일별 30% 기준), 거래량 분산 규칙 삭제</p><p class="rh-rs">일관성 규제는 이전부터 있습니다. 이번에는 1 Step의 기준값이 10포인트 낮아지고, 2 Step은 거래별에서 일별 기준이 되었습니다. 출금까지는 어려워지지만, 동시에 볼륨 분산 규칙은 삭제되었습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Rbfade9e4db" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">Rules V2: 최대 랏 수·동시 포지션 10개 상한 철폐</p><p class="rh-rs">제한 철폐. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R6c86662eb8" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지: 불명</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">Rules V2: 상관관계 통화쌍 헤지·갭 거래 등을 금지 행위에 추가</p><p class="rh-rs">상관 페어 헤지나 갭 거래 등으로 금지가 넓어졌습니다. 한정된 방법에 대한 제약입니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">확인: 이전 버전과 비교 / 공지: 불명</p><p class="rh-src">출처:<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R1d570ecbc4" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-01-15</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">중립</span><span class="rh-ann">공지: 불명</span><span class="rh-rank rh-rank-none">경계 등급: —</span></div><p class="rh-chg">Rules V2: 운영사를 Radias PTT FZ-LLC/TradeSim에서 Eightcap Services FZ-LLC(UAE)로 변경하고 제한 국가 갱신(8월 31일 판에서 Eightcap International Ltd(세이셸)로 재변경)</p><p class=
