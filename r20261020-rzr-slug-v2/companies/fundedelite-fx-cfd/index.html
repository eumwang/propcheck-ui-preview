<div class="rh-card"><h3>タイムライン <small>新しい順・変更日と確認情報は分けて表示</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="Rcddff3cfd4" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-13</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">【日本向け】1-step/2-step/LITE（5,000万円未満）ファンデッド：一貫性ルールなし→35%導入</p><p class="rh-rs">一貫性の条件がなかったところに35%の基準が加わり、出金条件が増えました。新規購入分のみで告知されているためBです。日本向けと英語版の違いは別に載せています。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://faq.fundedelite.com/ja/articles/17462703" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a></p></div></li><li class="rh-ev" data-history-id="R550b421d32" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-10-13</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">【日本向け】Instant ファンデッド：一貫性25%→35%（X返信では30%、購入時オプトアウト可）</p><p class="rh-rs">1日利益の上限比率が緩和。利用者に不利になる点は確認されていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://faq.fundedelite.com/ja/articles/17462703" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2110367481185411264" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R399912a05c" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-10-13</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">【日本向け】Flash Activation ファンデッド：一貫性30%→35%</p><p class="rh-rs">上限比率が緩和。利用者に不利になる点は確認されていません。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://faq.fundedelite.com/ja/articles/17462703" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R654800cdbe" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-13</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">【日本向け】5,000万円（$300K相当）口座：一貫性60%→35%（評価段階は対象外に）</p><p class="rh-rs">資金口座の一貫性の基準が60%から35%になり、厳しくなりました。評価段階は対象外になる緩和もあります。新規購入分のみで、告知されています。</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://faq.fundedelite.com/ja/articles/17462703" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R2af71c204f" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-13</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知あり</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">【日本向け】戦略リスク制限：日次損失上限の50%（ファンデッドのみ）→初期残高の1%/銘柄/日（相関銘柄合算）、全口座・全フェーズに適用（評価段階の初回違反は警告のみ）。違反時：評価は初回警告、ファンデッドはソフトブリーチ（リセット要）。英語FAQ（17437285）は従来どおり日次損失上限の50%・ファンデッドのみ（違反は口座閉鎖・利益喪失、ダッシュボードからリセット可）</p><p class="rh-rs">1銘柄・1日あたり1%の制限が全フェーズに広がりました。評価段階の初回は警告にとどまる緩和もあります。新規購入分のみで、告知されています。</p><p class="rh-rs">【日本向け】1%ルール違反時の扱い：評価段階はまず警告（初回は失格にしない、警告後も改善なければブリーチ）。ファンデッド段階はソフトブリーチ（ソフトブリーチリセットで口座のリセットが必要）</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://faq.fundedelite.com/ja/articles/13750971" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2109927153626177720" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://faq.fundedelite.com/en/articles/17437285" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a></p></div></li><li class="rh-ev" data-history-id="R330cf9fd04" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-10-13</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知あり</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">【日本向け】非アクティブ失効後の復活手数料：元価格の40%→20%</p><p class="rh-rs">手数料が半額。利用者に不利になる点は確認されていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://faq.fundedelite.com/ja/articles/13645330" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://web.archive.org/web/20260616053155/https://faq.fundedelite.com/en/articles/12675024-do-you-have-any-inactivity-rule" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R0fd7c885c5" data-event-id="R0fd7c885c5" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-08</b><small>変更日</small></div><div class="rh-bx">
