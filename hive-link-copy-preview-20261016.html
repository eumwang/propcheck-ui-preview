function setupArticle(f){const d=f.contentDocument;if(!d)return;d.addEventListener('click',event=>{const a=event.target.closest('a[data-review-path]');if(!a)return;event.preventDefault();const anchor=a.dataset.reviewAnchor||'';if(a.dataset.reviewPath==="/guides/fundedhive/"){const el=d.getElementById(anchor);f.contentWindow.scrollTo({top:el?el.getBoundingClientRect().top+f.contentWindow.scrollY-100:0,behavior:'instant'});}else{window.open('https://eumwang.github.io/propcheck-ui-preview/#page='+encodeURIComponent(a.dataset.reviewPath)+'&anchor='+encodeURIComponent(anchor),'_blank','noopener');}});}
