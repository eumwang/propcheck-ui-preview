<div class="rh-card"><h3>タイムライン <small>新しい順・変更日と確認情報は分けて表示</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="Rffa5372608" data-approved-category="not-applicable" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-08-31</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">Rules and Conditions：→V2（2026-08-31版）</p><p class="rh-rs">V2への版の更新をまとめた行です。具体的な変更はV2の各行に載せています。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：公式発表</p><p class="rh-src">出典：<a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R29b98ff07f" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-08-31</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">Rules V2 31.08.26：無料口座（Free Accounts）に生涯の出金上限を新設</p><p class="rh-rs">無料口座のみが対象ですが、生涯の出金上限が新たに設けられ、将来の報酬に上限がかかる実質的な変更です。対象が限られるためBです。獲得済みの利益の没収は確認していません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="Rc47d0b3f1c" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-08-31</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">Rules V2 31.08.26：過大エクスポージャーの判定基準をロット数→名目金額に変更</p><p class="rh-rs">ロットから金額への換算だけなのか、実際の上限が厳しくなったのか、基準値と対象銘柄が分からないため、警戒度は付けていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R152a14c0df" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-03-24</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">Rules V2 24.03.26：マーチンゲールの定義を拡大（含み損・確定損に関わらずロットを段階的・積極的に増やす/維持する行為）</p><p class="rh-rs">もともとあったマーチンゲールの禁止が、損益に関係なくロットを増やす・維持することにまで広がりました。通常のサイズ調整も違反とされるおそれがあり、業者の判断で禁止できる範囲が大きく広がったためAです。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260205224605/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R7af86fa44e" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-29</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">Rules V2 29.01.26：ギャンブル的な取引と判断された場合、利益上限（5%）の適用をさらに3回の出金に延長、出金額は「申請額（利益上限まで）」に</p><p class="rh-rs">5%の利益上限は以前からあります。今回、ギャンブル的と判断された後、さらに3回の出金まで上限を延ばせるようになり、金額と期間の両面で出金の処分が広がりました。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260205224605/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R913aafa24c" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-01-15</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知：不明</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">Rules V2：2 Stepのレバレッジ引き下げ FX 1:100→1:50、コモディティ 1:30→1:10、指数 1:50→1:20、暗号資産 1:5→1:2</p><p class="rh-rs">2 Stepの主要銘柄で、レバレッジが1/2〜1/3程度に下がりました。対象プランで取引できる量が減りますが、利益の没収や既存ポジションの強制決済は加わっていないためBです。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R9759444dc1" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-01-15</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：—</span></div><p class="rh-chg">Rules V2：日次DDの基準を有効証拠金→残高に変更</p><p class="rh-rs">損失の基準が有効証拠金から残高に変わりましたが、影響は日々の参照時点や含み損益の扱いによって変わり、計算式が確認できないため、警戒度は付けていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="Reb3a2a8646" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-01-15</b><small>記録日</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">改良</span><span class="rh-ann">告知：不明</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">Rules V2：出金までの待機期間を14日に統一（2 Stepは従来より短縮）</p><p class="rh-rs">待機期間短縮。利用者に不利になる点は確認されていません。</p><p class="rh-meta">遡及適用：不明</p><p class="rh-meta">確認：過去版との比較／告知：不明</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260214015631/https://superfunded.com/wp-content/uploads/2025/09/Rules-and-Conditions-SuperFunded-8.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260227091415/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener
