<div class="rh-card"><h3>タイムライン <small>新しい順・変更日と確認情報は分けて表示</small></h3><ol class="rh-tl"><li class="rh-ev" data-history-id="Rffa5372608" data-approved-category="not-applicable" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-08-31</b><small>台帳記録日（変更日等は本文参照）</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知の有無は未精査</span><span class="rh-rank rh-rank-none">警戒度：対象外</span></div><p class="rh-chg">Rules and Conditions：→V2（2026-08-31版）</p><p class="rh-rs">【対象外】V2版更新の見出し行。詳細はV2個別行で評価し、版更新を二重に数えない。</p><p class="rh-meta">遡及適用：台帳では不明（既存口座への適用とは区別）</p><p class="rh-meta">確認：公式発表／</p><p class="rh-src">出典：<a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R29b98ff07f" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-08-31</b><small>台帳記録日（変更日等は本文参照）</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知の有無は未精査</span><span class="rh-rank" style="background:#e07a1f">警戒度：B</span></div><p class="rh-chg">Rules V2 31.08.26：無料口座（Free Accounts）に生涯の出金上限を新設</p><p class="rh-rs">無料口座限定でも、生涯出金上限の新設は将来報酬に恒久的な上限を置く実質変更。無料であることだけを理由に軽微Cとはせず、限定対象のBを提案。既得利益没収までは未確認。</p><p class="rh-meta">遡及適用：台帳では不明（既存口座への適用とは区別）</p><p class="rh-meta">確認：アーカイブ差分／告知未精査</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="Rc47d0b3f1c" data-approved-category="unjudged" style="--rh-c:#8a959c"><div class="rh-dt"><b>2026-08-31</b><small>台帳記録日（変更日等は本文参照）</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#8a959c">中立</span><span class="rh-ann">告知の有無は未精査</span><span class="rh-rank rh-rank-none">警戒度：未判定</span></div><p class="rh-chg">Rules V2 31.08.26：過大エクスポージャーの判定基準をロット数→名目金額に変更</p><p class="rh-rs">【未判定＝根拠確認待ち】ロットから名目金額への換算だけか実質上限の厳格化か、閾値・対象銘柄が不足。</p><p class="rh-meta">遡及適用：台帳では不明（既存口座への適用とは区別）</p><p class="rh-meta">確認：アーカイブ差分／告知未精査</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://superfunded.com/wp-content/uploads/2026/08/SuperFunded-Rules-and-Conditions-31.08.26.pdf" target="_blank" rel="noopener noreferrer">superfunded.com</a></p></div></li><li class="rh-ev" data-history-id="R152a14c0df" data-approved-category="rank-A" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-03-24</b><small>台帳記録日（変更日等は本文参照）</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">改悪</span><span class="rh-ann">告知の有無は未精査</span><span class="rh-rank" style="background:#c62c33">警戒度：A</span></div><p class="rh-chg">Rules V2 24.03.26：マーチンゲールの定義を拡大（含み損・確定損に関わらずロットを段階的・積極的に増やす/維持する行為）</p><p class="rh-rs">既存のマーチンゲール禁止から、損益状態を問わないロットの増加・維持まで定義を拡げる差分は、通常のサイズ調整まで違反認定され得る範囲拡大。単なる用語明確化より重大な禁止裁量としてA案。</p><p class="rh-meta">遡及適用：台帳では不明（既存口座への適用とは区別）</p><p class="rh-meta">確認：アーカイブ差分／告知未精査</p><p class="rh-src">出典：<a href="https://web.archive.org/web/20260205224605/https://superfunded.com/wp-content/uploads/2026/01/SuperFunded-Rules-and-Conditions.pdf" target="_blank" rel="noopener noreferrer">web.archive.org</a> <a href="https://web.archive.org/web/20260401230446/https://superfunded.com/wp-content/uploads/2026/03/SuperFunded-Rules-and-Conditions-V2.0.pdf" target="_blank" rel="noopener noreferrer">web.archive.
