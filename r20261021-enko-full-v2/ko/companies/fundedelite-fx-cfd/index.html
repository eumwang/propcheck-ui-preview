:#1a8a5a"><div class="rh-dt"><b>2026-10-13</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">[일본 대상] Flash Activation 펀딩: 일관성 30% → 35%</p><p class="rh-rs">상한 비율 완화. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://faq.fundedelite.com/ja/articles/17462703" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R654800cdbe" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-13</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지 확인</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">[일본 대상] 5천만 엔(약 $300K) 계좌: 일관성 60% → 35%(평가 단계 제외)</p><p class="rh-rs">자금 계정의 일관성 기준이 60%에서 35%가 되어 엄격해졌습니다. 평가 단계는 대상에서 빠지는 완화도 있습니다. 신규 구매분만 대상이며 공지되었습니다.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://faq.fundedelite.com/ja/articles/17462703" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a></p></div></li><li class="rh-ev" data-history-id="R2af71c204f" data-approved-category="rank-B" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-13</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#d64045">불리한 변경</span><span class="rh-ann">공지 확인</span><span class="rh-rank" style="background:#e07a1f">경계 등급: B</span></div><p class="rh-chg">[일본 대상] 전략 위험 제한: 일일 손실 상한의 50%(펀딩만) → 초기 잔고의 종목당·하루 1%(상관 종목 합산), 모든 계좌·전 단계 적용(평가 첫 위반은 경고만). 제재는 평가 첫 위반 경고, 펀딩은 초기화가 필요한 소프트 위반. 영어 FAQ 17437285에는 종전의 일일 손실 상한 50%·펀딩만 적용이 남아 있음(위반 시 계좌 폐쇄·수익 상실, 대시보드 초기화 가능).</p><p class="rh-rs">1종목·1일당 1% 제한이 모든 단계로 넓어졌습니다. 평가 단계의 첫 위반은 경고로 그치는 완화도 있습니다. 신규 구매분만 대상이며 공지되었습니다.</p><p class="rh-rs">[일본] 1% 규칙 위반: 평가 단계에서는 우선 경고(첫 위반은 실격 아님, 경고 후 미시정 시 위반). 펀딩 단계에서는 소프트 위반으로 소프트 위반 초기화를 통한 계좌 초기화 필요.</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://x.com/FundedEliteJP/status/2109886874978242998" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://faq.fundedelite.com/ja/articles/13750971" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://x.com/FundedEliteJP/status/2109927153626177720" target="_blank" rel="noopener noreferrer">x.com</a> <a href="https://faq.fundedelite.com/en/articles/17437285" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a></p></div></li><li class="rh-ev" data-history-id="R330cf9fd04" data-approved-category="not-applicable" style="--rh-c:#1a8a5a"><div class="rh-dt"><b>2026-10-13</b><small>기록일</small></div><div class="rh-bx"><div class="rh-tags"><span class="rh-v" style="background:#1a8a5a">개선</span><span class="rh-ann">공지 확인</span><span class="rh-rank rh-rank-none">경계 등급: 평가 대상 아님</span></div><p class="rh-chg">[일본 대상] 휴면 만료 후 복구 수수료: 원래 가격의 40% → 20%</p><p class="rh-rs">수수료가 절반이 되었습니다. 이용자에게 불리한 점은 확인되지 않았습니다.</p><p class="rh-meta">소급 적용: 불명</p><p class="rh-meta">근거: 공식 발표 /</p><p class="rh-src">출처:<a href="https://faq.fundedelite.com/ja/articles/13645330" target="_blank" rel="noopener noreferrer">faq.fundedelite.com</a> <a href="https://web.archive.org/web/20260616053155/https://faq.fundedelite.com/en/articles/12675024-do-you-have-any-inactivity-rule" target="_blank" rel="noopener noreferrer">web.archive.org</a></p></div></li><li class="rh-ev" data-history-id="R0fd7c885c5" data-event-id="R0fd7c885c5" style="--rh-c:#d64045"><div class="rh-dt"><b>2026-10-08</b><small>변경일</small></div><div class
